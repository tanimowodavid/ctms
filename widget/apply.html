<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apply to this cohort</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #17212b; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1rem; background: transparent; }
    .card { max-width: 34rem; margin: 0 auto; padding: 1.5rem; border: 1px solid #d8e0e8; border-radius: 1rem; background: #fff; box-shadow: 0 8px 28px #17212b12; }
    h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
    #cohort-name { margin: 0 0 1.25rem; color: #526170; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 650; }
    input, select, button { width: 100%; min-height: 2.8rem; padding: .65rem .75rem; border: 1px solid #aebbc8; border-radius: .5rem; font: inherit; }
    button { margin-top: 1.25rem; border: 0; background: #155eef; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 1.5rem; margin: 1rem 0 0; }
    #message[data-kind="success"] { color: #087443; }
    #message[data-kind="error"] { color: #b42318; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Apply to this cohort</h1>
    <p id="cohort-name">Loading cohort…</p>
    <form id="application-form" hidden>
      <label for="full-name">Full name</label>
      <input id="full-name" name="fullName" autocomplete="name" maxlength="255" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="320" required>
      <label for="track">Track</label>
      <select id="track" name="trackId" required></select>
      <button id="submit-button" type="submit">Submit application</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script src="apply.js" defer></script>
</body>
</html>
